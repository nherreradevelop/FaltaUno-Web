# FaltaUno - web en Docker.
# Necesita la API levantada (repositorio FaltaUno-API: docker compose up -d) en http://localhost:3000.
#
# Desarrollo:   docker compose up -d --build
#               docker compose watch        (recarga en caliente: copia los cambios de src/ al contenedor)
# Producción:   docker compose -f docker-compose.yml -f docker-compose.produccion.yml up -d --build
# Detener:      docker compose down
#
# Las variables salen de .env (copiar .env.example). En producción se incorporan al compilar.
name: faltauno-web

services:
  web:
    build:
      context: .
      target: desarrollo
    image: faltauno-web:desarrollo
    container_name: faltauno-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - '5173:5173'
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync+restart
          path: ./vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./package-lock.json
