# FaltaUno - web en producción.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos con hash en el nombre (assets de Vite): se pueden guardar en caché por un año
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router: cualquier ruta que no sea un archivo devuelve index.html (por ejemplo /actividades/123)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
