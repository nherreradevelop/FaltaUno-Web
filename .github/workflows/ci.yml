# Integración continua (Plan de calidad - SQA):
# en cada pull request y push a develop/main se ejecutan el análisis estático,
# el formato, la compilación y las pruebas. Si alguna etapa falla, no se puede hacer merge.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Web - lint, formato y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Se activa solo cuando el proyecto de Vite tenga su script de build
      - run: npm run build --if-present
      - run: npm test --if-present
